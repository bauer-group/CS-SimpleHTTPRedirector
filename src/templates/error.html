<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.StatusCode}} - {{.Title}}</title>
    <style>
        :root {
            --color-primary: #FF8500;
            --color-white: #FFFFFF;
            --color-black: #000000;
            --color-grey: #2E3236;
            --color-accent-blue: #33475B;
            --color-dark-grey: #1C1D29;
            --color-blue-grey: #425B76;
            --color-light-1: #F2F2F2;
            --color-light-2: #F3F3F7;
            --color-text-dark: #444444;
            --color-text-medium: #5B5B5B;
            --color-text-light: #888888;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--color-grey);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-light-1);
        }
        .container {
            text-align: center;
            padding: 3rem;
            max-width: 600px;
        }
        .logo {
            margin-bottom: 2rem;
        }
        .logo svg {
            width: 280px;
            height: auto;
        }
        .status-code {
            font-size: 8rem;
            font-weight: 700;
            color: var(--color-primary);
            line-height: 1;
            margin-bottom: 1rem;
        }
        .title {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--color-white);
        }
        .message {
            font-size: 1.1rem;
            color: var(--color-text-light);
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .host {
            display: inline-block;
            background: rgba(255, 133, 0, 0.15);
            border: 1px solid rgba(255, 133, 0, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 0.95rem;
            color: var(--color-primary);
            margin-bottom: 2rem;
        }
        .divider {
            width: 60px;
            height: 4px;
            background: var(--color-primary);
            border-radius: 2px;
            margin: 0 auto 2rem;
        }
        .footer {
            font-size: 0.85rem;
            color: var(--color-text-light);
            margin-top: 2rem;
        }
        .footer a {
            color: var(--color-text-light);
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
